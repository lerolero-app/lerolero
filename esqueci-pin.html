				}

				addEventListener('error', function (e) { if (broken(e.error || e.message)) recover(); });

				addEventListener('load', function () {
					setTimeout(function () {
						try { sessionStorage.removeItem(KEY); } catch (e) {}
					}, 10000);
				});
